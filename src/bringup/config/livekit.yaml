# yaml-language-server: $schema=../../../ros-portal/src/ros_portal_config/schema/ros_portal_config.schema.json
# Copyright 2026 LiveKit

ros_portal:
  version: "0.0.1"

  topics:
    # Commands received from the controller (LiveKit -> ROS).
    - topic: "/.*/cmd_vel"
      direction: "in"

    - topic: "/goal_pose"
      direction: "in"

    # Telemetry / sensor / nav streams sent out to LiveKit (ROS -> LiveKit)
    - topic: "/map"
      direction: "out"

    - topic: "/plan"
      direction: "out"

    - topic: "/robot_description"
      direction: "out"

    # Pan/tilt head servo positions (pan_tilt_driver publishes at 20 Hz).
    - topic: "/.*/joint_states"
      direction: "out"
      encoding: "jsonschema"

    - topic: "/.*/pan_tilt_velocity_cmd"
      direction: "in"

    - topic: "/imu/data_raw"
      max_rate_hz: 20
      direction: "out"

    - topic: "/odom"
      direction: "out"
      encoding: "jsonschema"

    - topic: "/battery_state"
      direction: "out"
      encoding: "jsonschema"

    - topic: "/headlights_state"
      direction: "out"
      encoding: "jsonschema"

    # Transform tree — required so the controller's Foxglove 3D panel has a
    # valid fixed frame (without it the click-to-publish tool is hidden).

  video_sources:
    # Side-by-side stereo USB camera (2x 1280x720 MJPEG @ 60 fps). The image
    # has no Jetson hardware encoder, so frames are decoded and x264-encoded
    # in software, dropping to 30 fps first to halve the encode load.
    # Gstreamer sources publish a single pre-encoded layer (no simulcast).
    - track_name: "stereo_camera"
      simulcast: false
      source:
        type: "gstreamer"
        pipeline: >-
          v4l2src device=/dev/v4l/by-id/usb-3D_USB_Camera_3D_USB_Camera_01.00.00-video-index0
          do-timestamp=true
          ! image/jpeg,width=2560,height=720,framerate=60/1
          ! jpegdec
          ! videorate drop-only=true ! video/x-raw,framerate=30/1
          ! videoconvert ! video/x-raw,format=I420
          ! x264enc name=lk_encoder tune=zerolatency speed-preset=ultrafast
          key-int-max=30 bitrate=4000
          ! video/x-h264,profile=constrained-baseline,stream-format=byte-stream,alignment=au
          ! appsink name=lk_appsink sync=false max-buffers=2 drop=true
        codec: "h264"
        resolution:
          width: 2560
          height: 720
        rate_control:
          element: "lk_encoder"
          property: "bitrate"
          unit: "kbps"
      publish_options:
        max_bitrate_bps: 4000000
        max_framerate: 30
